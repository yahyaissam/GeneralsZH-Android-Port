name: Build Android

permissions:
  contents: write
  pull-requests: read
  actions: write

on:
  pull_request:
    branches:
      - main
    paths:
      - 'GeneralsMD/**'
      - 'Core/**'
      - 'Dependencies/**'
      - 'cmake/**'
      - 'android/**'
      - 'scripts/build/android/**'
      - 'Patches/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      preset:
        type: choice
        description: "CMake preset for Android"
        options:
          - android-vulkan
        default: android-vulkan
      version_name:
        type: string
        description: "Override versionName (e.g. 1.2.0)."
        default: ""
      version_code:
        type: string
        description: "Override versionCode."
        default: ""
      create_release:
        type: boolean
        description: "Also publish a GitHub Release."
        default: false
      release_notes:
        type: string
        description: "Optional custom text for the top of the release description."
        default: ""

jobs:
  build-android:
    name: apk@${{ inputs.preset || 'android-vulkan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRESET: ${{ inputs.preset || 'android-vulkan' }}
      NDK_VERSION: "27.2.12479018"
      GRADLE_VERSION: "8.9"
      CMDLINE_TOOLS_VERSION: "13114758"
      CMDLINE_TOOLS_SHA1: "5fdcc763663eefb86a5b8879697aa6088b041e70"
      VCPKG_COMMIT: "42e4e33e1505c9f47b58c21e0f557c1571b751ee"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout DXVK fork submodule
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 references/fbraz3-dxvk
          git -C references/fbraz3-dxvk submodule update --init --depth 1
          echo "DXVK_REF=$(git rev-parse HEAD:references/fbraz3-dxvk)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Android SDK cache
        id: cache-android-sdk
        uses: actions/cache/restore@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35
          
      - name: Install Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${{ env.CMDLINE_TOOLS_VERSION }}_latest.zip"
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          sudo chown -R "$(id -u):$(id -g)" /opt/android-sdk
          rm /tmp/cmdline-tools.zip
          SDKMANAGER=/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;${{ env.NDK_VERSION }}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          
      - name: Export Android SDK environment
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install build tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends ninja-build meson pkg-config glslang-tools ccache

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ env.PRESET }}-${{ github.run_id }}
          restore-keys: ccache-android-${{ env.PRESET }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=3G
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache/restore@v5
        with:
          path: |
            /opt/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}
          restore-keys: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d /opt/vcpkg/.git ]; then git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg; fi
          git -C /opt/vcpkg checkout ${{ env.VCPKG_COMMIT }}
          if [ ! -f /opt/vcpkg/vcpkg ]; then /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics; fi
          echo "VCPKG_ROOT=/opt/vcpkg" >> "$GITHUB_ENV"

      - name: Fix Compile Errors & Bypass Adrenotools (32-bit Fix)
        run: |
          # 1. تجاهل تحذيرات مكتبة الصوت
          sed -i 's/cmake_minimum_required.*/&\nadd_compile_options(-Wno-error=suggest-override)/' CMakeLists.txt
          # 2. تفريغ ملف استدعاء مكتبة Adrenotools (التي لا تدعم 32-بت)
          echo "" > cmake/adrenotools.cmake
          # 3. حذف أوامر البحث عن أدوات Adrenotools من سكربت التجميع
          sed -i '/adrenotools/d' scripts/build/android/package-android-zh.sh
          sed -i '/hook/d' scripts/build/android/package-android-zh.sh

      - name: Configure CMake (Android)
        run: |
          set -o pipefail
          mkdir -p logs
          cmake --preset ${{ env.PRESET }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DANDROID_CI_BUILD_NUMBER=${{ github.run_number }} 2>&1 | tee logs/configure_android.log

      - name: Build z_generals (libmain.so) + DXVK d3d8/d3d9
        run: |
          set -o pipefail
          mkdir -p logs
          # تم حذف بناء (hook_impl, gsl_alloc_hook, etc) لأننا أوقفنا الاعتماد عليها
          cmake --build build/${{ env.PRESET }} --target z_generals dxvk_d3d8_install -- -k 0 2>&1 | tee logs/build_android.log
          ccache --show-stats

      - name: Verify artifacts (Modified for 32-bit)
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          GAME_LIB="build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so"
          if [ ! -f "$GAME_LIB" ]; then exit 1; fi
          READELF_OK=0
          for attempt in 1 2 3 4 5; do
            if "$READELF" -h "$GAME_LIB" 2>/dev/null | grep -q ARM; then READELF_OK=1; break; fi
            sleep 1
          done
          [ "$READELF_OK" = "1" ] || exit 1
          echo "Artifacts verified: 32-bit ARM libmain.so"

      - name: Collect symbol table
        run: |
          set -e
          TOOLS="$(dirname "$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)")"
          LIB="build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so"
          mkdir -p symbols
          OUT="symbols/libmain-run${{ github.run_number }}.symbols.txt"
          "$TOOLS/llvm-nm" --defined-only --numeric-sort --print-size --demangle "$LIB" > "$OUT" || true
          gzip -9 "$OUT"

      - name: Strip debug symbols
        run: |
          STRIP="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-strip | head -1)"
          for lib in "build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3-build/libSDL3.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3_image-build/libSDL3_image.so" \
                     "build/${{ env.PRESET }}/_deps/openal_soft-build/libopenal.so" \
                     "build/${{ env.PRESET }}/libgamespy.so"; do
            [ -f "$lib" ] && "$STRIP" --strip-unneeded "$lib"
          done

      - name: Set artifact version
        id: artifact
        run: |
          echo "apk_name=GeneralsXZH-android-run${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Package APK
        env:
          GX_ANDROID_STAGING: ${{ github.workspace }}/android-staging
        run: |
          ./scripts/build/android/package-android-zh.sh

      - name: Locate APK
        id: locate
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "${{ steps.artifact.outputs.apk_name }}"
          echo "path=${{ steps.artifact.outputs.apk_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.apk_name }}
          path: ${{ steps.locate.outputs.path }}
          retention-days: 7
